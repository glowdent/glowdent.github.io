<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Glowdent Review Assistant</title>
<style>
body{font-family:Arial;margin:0;background:#eefbfd;color:#111827}.wrap{max-width:600px;margin:auto;padding:16px}.head{background:#000;border-radius:18px;padding:12px;text-align:center}.head img{max-width:100%;max-height:140px}.card{background:#fff;border-radius:18px;padding:20px;margin-top:14px;box-shadow:0 5px 20px #0001}h1{text-align:center}label{display:block;font-weight:bold;margin:15px 0 7px}select,textarea,button{width:100%;padding:13px;border-radius:11px;font-size:16px;box-sizing:border-box}select,textarea{border:1px solid #ccd8dc}textarea{min-height:110px}.row{display:flex;gap:8px}.pill{flex:1;padding:12px;border:1px solid #ccd8dc;border-radius:11px;text-align:center;font-weight:bold}.active{background:#e5fafc;border-color:#42b7c4}.primary{background:#42b7c4;border:0;font-weight:bold;margin-top:14px}.secondary{background:#eef2f4;border:0;font-weight:bold;margin-top:10px}.draft{background:#f7fafb;border:1px solid #ddd;border-radius:12px;padding:14px;line-height:1.6;white-space:pre-wrap}.note{font-size:12px;color:#667085;margin-top:10px;line-height:1.5}#result{display:none}
</style></head><body><div class="wrap"><div class="head"><img src="glowdent-logo.png"></div>
<div class="card"><h1>Share your experience</h1><p style="text-align:center;color:#667085">Your genuine feedback helps other patients.</p>
<label>Language</label><div class="row"><div class="pill active" onclick="setLang('en',this)">English</div><div class="pill" onclick="setLang('mr',this)">मराठी</div><div class="pill" onclick="setLang('hi',this)">हिन्दी</div></div>
<label>What type of service did you receive?</label><div class="row"><div class="pill active" onclick="setCat('dental',this)">🦷 Dental</div><div class="pill" onclick="setCat('skin',this)">✨ Skin & Aesthetic</div><div class="pill" onclick="setCat('hair',this)">💆 Hair & Scalp</div></div>
<label>Select your service</label><select id="service"></select>
<label>Tell us about your experience in your own words</label><textarea id="exp" placeholder="Example: Doctor explained everything clearly and the treatment was comfortable."></textarea>
<button class="primary" onclick="makeDraft()">Create my review draft</button></div>
<div class="card" id="result"><label>Your editable review draft</label><div class="draft" id="draft"></div><button class="secondary" onclick="copyDraft()">Copy review</button><button class="primary" onclick="openGoogle()">Open Google Review</button><p class="note">Please read and edit the draft so it accurately reflects your own experience before submitting it.</p></div>
</div>
<script>
const G='https://search.google.com/local/writereview?placeid=ChIJjwrR3Evr3TsRhicO1vXN_Mg';
let lang='en',cat='dental';
const S={
en:{dental:['Dental Check-up','Teeth Cleaning','Root Canal Treatment','Dental Filling','Crown & Bridge','Tooth Extraction','Smile Designing / Cosmetic Dentistry'],skin:['Skin Consultation','Medi-Facial','HydraFacial','Chemical Peel / Party Peel','Pigmentation & Dark Spot Treatment','Acne Treatment','Acne Scar Treatment','Skin Brightening / Glow Treatment','Skin Rejuvenation','Microneedling / Dermapen','Skin Tightening'],hair:['Hair Fall Treatment','PRP Hair Treatment','GFC Hair Treatment','Scalp Treatment','Dandruff / Scalp Care']},
mr:{dental:['डेंटल चेक-अप','दातांची स्वच्छता','रूट कॅनाल उपचार','डेंटल फिलिंग','क्राउन आणि ब्रिज','दात काढण्याचा उपचार','स्माईल डिझायनिंग / कॉस्मेटिक डेंटिस्ट्री'],skin:['त्वचा सल्ला','मेडी-फेशियल','हायड्राफेशियल','केमिकल पील / पार्टी पील','पिग्मेंटेशन व डार्क स्पॉट उपचार','अॅक्ने उपचार','अॅक्ने स्कार उपचार','स्किन ब्राइटनिंग / ग्लो उपचार','स्किन रीजुव्हनेशन','मायक्रोनीडलिंग / डर्मापेन','स्किन टाइटनिंग'],hair:['केस गळती उपचार','PRP हेअर ट्रीटमेंट','GFC हेअर ट्रीटमेंट','स्कॅल्प ट्रीटमेंट','कोंडा / स्कॅल्प केअर']},
hi:{dental:['डेंटल चेक-अप','दांतों की सफाई','रूट कैनाल उपचार','डेंटल फिलिंग','क्राउन और ब्रिज','दांत निकालने का उपचार','स्माइल डिजाइनिंग / कॉस्मेटिक डेंटिस्ट्री'],skin:['स्किन कंसल्टेशन','मेडी-फेशियल','हाइड्राफेशियल','केमिकल पील / पार्टी पील','पिग्मेंटेशन व डार्क स्पॉट उपचार','एक्ने उपचार','एक्ने स्कार उपचार','स्किन ब्राइटनिंग / ग्लो ट्रीटमेंट','स्किन रीजुवेनेशन','माइक्रोनीडलिंग / डर्मापेन','स्किन टाइटनिंग'],hair:['हेयर फॉल ट्रीटमेंट','PRP हेयर ट्रीटमेंट','GFC हेयर ट्रीटमेंट','स्कैल्प ट्रीटमेंट','डैंड्रफ / स्कैल्प केयर']}
};
function fill(){service.innerHTML='';S[lang][cat].forEach(x=>{let o=document.createElement('option');o.textContent=x;service.appendChild(o)})}
function setLang(x,e){lang=x;document.querySelectorAll('.row:first-of-type .pill').forEach(p=>p.classList.remove('active'));e.classList.add('active');fill()}
function setCat(x,e){cat=x;e.parentNode.querySelectorAll('.pill').forEach(p=>p.classList.remove('active'));e.classList.add('active');fill()}
function makeDraft(){let x=exp.value.trim();if(!x){alert('Please describe your experience first.');return}draft.textContent=`I had a good experience at Glowdent Dental And Aesthetic Clinic in Nashik. I visited for ${service.value}. ${x} I appreciated the care and clear communication throughout my visit.`;result.style.display='block';result.scrollIntoView({behavior:'smooth'})}
async function copyDraft(){await navigator.clipboard.writeText(draft.textContent);alert('Review copied. Now open Google and paste it.')}
function openGoogle(){window.open(G,'_blank')}
fill();
</script></body></html>
